name: Build iOS app

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Elric AI (iOS)
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ./ios
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Tool versions
        run: |
          xcodebuild -version
          swift --version
          xcrun --show-sdk-version --sdk iphoneos

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: ios/.spm
          key: spm-${{ runner.os }}-${{ hashFiles('ios/project.yml') }}

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ElricAI.xcodeproj -scheme ElricAI \
            -clonedSourcePackagesDirPath .spm

      - name: Build for iOS Simulator (compile check)
        run: |
          set -o pipefail
          xcodebuild build \
            -project ElricAI.xcodeproj -scheme ElricAI -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath .spm \
            -derivedDataPath build/sim \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build-sim.log | grep -E "error:|warning: .*ElricAI|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build-sim.log

      - name: Build for iOS device (unsigned, Release)
        run: |
          set -o pipefail
          xcodebuild build \
            -project ElricAI.xcodeproj -scheme ElricAI -configuration Release \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath .spm \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build-device.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build-device.log

      - name: Package unsigned .ipa
        run: |
          APP="build/device/Build/Products/Release-iphoneos/Elric AI.app"
          test -d "$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry ElricAI-unsigned.ipa Payload
          ls -lh ElricAI-unsigned.ipa

      - name: Upload unsigned .ipa
        uses: actions/upload-artifact@v4
        with:
          name: elric-ios-unsigned-ipa
          path: ios/ElricAI-unsigned.ipa
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elric-ios-build-logs
          path: ios/*.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Signed build → TestFlight (skeleton, disabled until secrets exist).
  # Needs a paid Apple Developer account. Add these repo secrets, then remove
  # the `if: false` line:
  #   APPLE_CERT_P12           base64 of the Apple Distribution .p12
  #   APPLE_CERT_PASSWORD      password of the .p12
  #   PROVISIONING_PROFILE     base64 of the App Store .mobileprovision for
  #                            in.elricai.app (must include the
  #                            Increased Memory Limit capability)
  #   APPLE_TEAM_ID            10-char team id
  #   ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8   App Store Connect API key
  # ---------------------------------------------------------------------------
  signed:
    name: Signed build + TestFlight (disabled)
    if: false
    needs: build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./ios
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen && xcodegen generate --spec project.yml
      - name: Install certificate and profile
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
        run: |
          KC=$RUNNER_TEMP/build.keychain-db; KP=$(uuidgen)
          echo "$APPLE_CERT_P12" | base64 --decode > $RUNNER_TEMP/cert.p12
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security import $RUNNER_TEMP/cert.p12 -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KP" "$KC"
          security list-keychain -d user -s "$KC"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/elric.mobileprovision
      - name: Archive and export
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive -project ElricAI.xcodeproj -scheme ElricAI -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/ElricAI.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE_SPECIFIER="Elric AI App Store"
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>in.elricai.app</key><string>Elric AI App Store</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/ElricAI.xcarchive -exportPath build/export -exportOptionsPlist ExportOptions.plist
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          xcrun altool --upload-app -t ios -f build/export/*.ipa --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
