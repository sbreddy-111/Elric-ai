name: Build Play AAB

# Builds the Google Play release: a release Android App Bundle signed with the Play upload key.
# Needs three repo secrets (Settings > Secrets and variables > Actions):
#   ANDROID_UPLOAD_KEYSTORE_B64   base64 of the PKCS12 upload keystore
#   ANDROID_UPLOAD_KEY_PASSWORD   its store/key password
#   ANDROID_UPLOAD_KEY_ALIAS      key alias ("upload")
# Without them the job still builds, but publishes only an UNSIGNED bundle as an artifact.
# Nothing is uploaded to Google Play here.

on:
  workflow_dispatch:
    inputs:
      signed_aab_url:
        description: "Optional: short-lived URL of an AAB already signed with the upload key (used while the upload-key secrets are not set). Skips the build; the bundle is verified, reported and attached to the release."
        required: false
        default: ""
  push:
    tags: [ "play-*" ]

concurrency:
  group: play-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: Build signed release AAB
    if: github.event_name != 'workflow_dispatch' || inputs.signed_aab_url == ''
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ./Android/src
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
      BUNDLETOOL_VERSION: "1.18.3"
    steps:
      - name: Checkout the source code
        uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Android SDK Platform 37
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37.0"

      - name: Read version
        id: ver
        run: |
          NAME=$(grep -E '^\s*versionName\s*=' app/build.gradle.kts | head -1 | sed -E 's/.*"(.*)".*/\1/')
          CODE=$(grep -E '^\s*versionCode\s*=' app/build.gradle.kts | head -1 | sed -E 's/[^0-9]//g')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Elric AI $NAME ($CODE)"

      - name: Restore upload keystore
        id: key
        env:
          KS_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KS_ALIAS" ]; then
            echo "$KS_B64" | base64 --decode > "$RUNNER_TEMP/upload.p12"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Upload key found."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Upload-key secrets are missing: building an UNSIGNED bundle (not published as a release)."
          fi

      - name: Build release bundle
        env:
          ANDROID_UPLOAD_KEYSTORE_PATH: ${{ steps.key.outputs.signed == 'true' && format('{0}/upload.p12', runner.temp) || '' }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
        # More heap than gradle.properties' 2 GB: bundling/signing a ~130 MB bundle can run out.
        run: ./gradlew bundleRelease --stacktrace -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Name the bundle
        id: aab
        run: |
          SRC=$(ls app/build/outputs/bundle/release/*.aab | head -1)
          mkdir -p "$GITHUB_WORKSPACE/out"
          if [ "${{ steps.key.outputs.signed }}" = "true" ]; then
            OUT="$GITHUB_WORKSPACE/out/Elric-AI-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}.aab"
            cp "$SRC" "$OUT"
          else
            # Without the upload key Gradle signs with the debug key, which Play rejects: strip it.
            OUT="$GITHUB_WORKSPACE/out/Elric-AI-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}-unsigned.aab"
            cp "$SRC" "$OUT"
            zip -q -d "$OUT" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.EC' 'META-INF/*.DSA' 'META-INF/MANIFEST.MF' || true
          fi
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          ls -l "$OUT"
          echo "AAB size: $(du -h "$OUT" | cut -f1) ($(stat -c %s "$OUT") bytes)"

      - name: Verify signature (upload key, not debug)
        if: steps.key.outputs.signed == 'true'
        run: |
          jarsigner -verify -verbose:summary -certs "${{ steps.aab.outputs.path }}" > "$RUNNER_TEMP/verify.txt" 2>&1 || { cat "$RUNNER_TEMP/verify.txt"; exit 1; }
          grep -E "jar verified" "$RUNNER_TEMP/verify.txt"
          grep -q "CN=Elric AI" "$RUNNER_TEMP/verify.txt" || { echo "::error::Bundle is not signed with the Elric AI upload key"; exit 1; }
          if grep -q "CN=Android Debug" "$RUNNER_TEMP/verify.txt"; then echo "::error::Debug-signed bundle"; exit 1; fi
          echo "Signed with the Elric AI upload key."

      - name: Bundle report (bundletool)
        run: |
          curl -sSL -o "$RUNNER_TEMP/bundletool.jar" \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          BT="java -jar $RUNNER_TEMP/bundletool.jar"
          AAB="${{ steps.aab.outputs.path }}"
          $BT validate --bundle="$AAB" > /dev/null && echo "bundletool validate: OK"
          echo "--- manifest ---"
          $BT dump manifest --bundle="$AAB" | grep -E "versionCode|versionName|package=|targetSdkVersion|minSdkVersion|debuggable|testOnly|usesCleartextTraffic|uses-permission" || true
          echo "--- 25 largest entries ---"
          unzip -l "$AAB" | sort -k1 -n -r | head -27
          echo "--- size per device ---"
          printf '{"supportedAbis":["arm64-v8a"],"supportedLocales":["en"],"screenDensity":480,"sdkVersion":35}' > "$RUNNER_TEMP/arm64.json"
          $BT build-apks --bundle="$AAB" --output="$RUNNER_TEMP/app.apks" --overwrite
          echo "arm64-v8a phone (xxhdpi, en, API 35), bytes MIN,MAX:"
          $BT get-size total --apks="$RUNNER_TEMP/app.apks" --device-spec="$RUNNER_TEMP/arm64.json"
          echo "All devices by ABI, bytes:"
          $BT get-size total --apks="$RUNNER_TEMP/app.apks" --dimensions=ABI

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.key.outputs.signed == 'true' && 'elric-ai-play-aab' || 'elric-ai-aab-unsigned' }}
          path: ${{ steps.aab.outputs.path }}
          if-no-files-found: error

      - name: Attach to prerelease play-${{ steps.ver.outputs.name }}
        if: steps.key.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: play-${{ steps.ver.outputs.name }}
          name: Elric AI ${{ steps.ver.outputs.name }} (Play upload bundle)
          prerelease: true
          make_latest: false
          body: "Release Android App Bundle for Google Play, signed with the Elric AI upload key. versionName ${{ steps.ver.outputs.name }}, versionCode ${{ steps.ver.outputs.code }}. Upload this .aab in Play Console (Play App Signing)."
          files: ${{ steps.aab.outputs.path }}

  publish_signed:
    name: Verify and publish an upload-key-signed AAB
    if: github.event_name == 'workflow_dispatch' && inputs.signed_aab_url != ''
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUNDLETOOL_VERSION: "1.18.3"
    steps:
      - name: Download the signed bundle (before the short-lived URL expires)
        env:
          AAB_URL: ${{ inputs.signed_aab_url }}
        run: |
          mkdir -p out
          curl -sSfL --retry 3 -o out/bundle.aab "$AAB_URL"
          ls -l out/bundle.aab

      - name: Checkout the source code
        uses: actions/checkout@v4
        with:
          path: src
          sparse-checkout: Android/src/app/build.gradle.kts
          sparse-checkout-cone-mode: false

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Read version and name the bundle
        id: ver
        run: |
          G=src/Android/src/app/build.gradle.kts
          NAME=$(grep -E '^\s*versionName\s*=' $G | head -1 | sed -E 's/.*"(.*)".*/\1/')
          CODE=$(grep -E '^\s*versionCode\s*=' $G | head -1 | sed -E 's/[^0-9]//g')
          OUT="$GITHUB_WORKSPACE/out/Elric-AI-$NAME-$CODE.aab"
          mv out/bundle.aab "$OUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "AAB size: $(du -h "$OUT" | cut -f1) ($(stat -c %s "$OUT") bytes)"

      - name: Verify signature and version
        run: |
          AAB="${{ steps.ver.outputs.path }}"
          jarsigner -verify -verbose:summary -certs "$AAB" > verify.txt 2>&1 || { cat verify.txt; exit 1; }
          grep -E "jar verified" verify.txt
          grep -q "CN=Elric AI" verify.txt || { echo "::error::Not signed with the Elric AI upload key"; exit 1; }
          if grep -q "CN=Android Debug" verify.txt; then echo "::error::Debug-signed bundle"; exit 1; fi
          curl -sSL -o bundletool.jar "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          java -jar bundletool.jar validate --bundle="$AAB" > /dev/null && echo "bundletool validate: OK"
          java -jar bundletool.jar dump manifest --bundle="$AAB" | grep -E "versionCode|targetSdkVersion|debuggable|testOnly|uses-permission" || true
          java -jar bundletool.jar dump manifest --bundle="$AAB" | grep -q "android:versionName=\"${{ steps.ver.outputs.name }}\"" || { echo "::error::Bundle version does not match the source"; exit 1; }
          printf '{"supportedAbis":["arm64-v8a"],"supportedLocales":["en"],"screenDensity":480,"sdkVersion":35}' > arm64.json
          java -jar bundletool.jar build-apks --bundle="$AAB" --output=app.apks --overwrite
          echo "arm64-v8a phone (xxhdpi, en, API 35), bytes MIN,MAX:"
          java -jar bundletool.jar get-size total --apks=app.apks --device-spec=arm64.json

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: elric-ai-play-aab
          path: ${{ steps.ver.outputs.path }}
          if-no-files-found: error

      - name: Attach to prerelease play-${{ steps.ver.outputs.name }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: play-${{ steps.ver.outputs.name }}
          name: Elric AI ${{ steps.ver.outputs.name }} (Play upload bundle)
          prerelease: true
          make_latest: false
          files: ${{ steps.ver.outputs.path }}
