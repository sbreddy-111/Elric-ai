  name: Build Android APK
  
  on:
    workflow_dispatch:
    push:
      branches: [ "main" ]
      paths:
        - 'Android/**'
        - '.github/workflows/build_android.yaml'
    pull_request:
      branches: [ "main" ]
      paths:
        - 'Android/**'
  
  jobs:
    build_apk:
      name: Build Android APK
      permissions:
        contents: write
      runs-on: ubuntu-latest
      defaults:
        run:
          working-directory: ./Android/src
      steps:
        - name: Checkout the source code
          uses: actions/checkout@v3
        - uses: actions/setup-java@v4
          with:
            distribution: 'temurin'
            java-version: '21'
        - name: Install Android SDK Platform 37
          run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37.0"
        - name: Build
          run: ./gradlew assembleRelease
  
  
        - name: Upload APK
          uses: actions/upload-artifact@v4
          with:
            name: elric-ai-apk
            path: Android/src/app/build/outputs/apk/release/*.apk

        - name: Rename APK for testers
          if: github.event_name != 'pull_request'
          working-directory: .
          run: cp Android/src/app/build/outputs/apk/release/*.apk Elric-AI.apk

        - name: Publish test APK (public download, no login)
          if: github.event_name != 'pull_request'
          uses: softprops/action-gh-release@v2
          with:
            tag_name: android-test
            name: Elric AI Android (test build)
            prerelease: true
            make_latest: false
            body: "Test build of Elric AI for Android. Download Elric-AI.apk below and open it to install."
            files: Elric-AI.apk
