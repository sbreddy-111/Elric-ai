name: ElricAI
options:
  bundleIdPrefix: in.elricai
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  LiteRTLM:
    url: https://github.com/google-ai-edge/LiteRT-LM
    exactVersion: 0.19.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ElricAI:
    type: application
    platform: iOS
    sources:
      - path: ElricAI
    dependencies:
      - package: LiteRTLM
        product: LiteRTLM
    entitlements:
      path: ElricAI/ElricAI.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
    info:
      path: ElricAI/Info.plist
      properties:
        CFBundleDisplayName: Elric AI
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        CFBundleLocalizations: [en, hi]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.elricai.app
        PRODUCT_NAME: Elric AI
        PRODUCT_MODULE_NAME: ElricAI
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: ElricAI/ElricAI.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
